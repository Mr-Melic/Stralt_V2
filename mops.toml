[package]
name = "backend"
version = "0.1.0"

[build]
outputDir = "src/backend/dist"
args = [ "--release" ]
check-wasm = true
check-deploy = true

[canisters.backend]
main = "src/backend/main.mo"

# `.old/src/backend/dist/backend.most` is Caffeine-owned: it is the stable
# signature of the last build Caffeine deployed successfully for this project
# (2026-08-31, PR #181 merge f8aa05e: chain 20260826/27/31, 42 stables, no
# GameKey). Caffeine keeps its own copy and compares every import against it
# (`caffeine projects clone` also writes it here), so the file in the repo must
# be byte-identical to that build's `src/backend/dist/backend.most` — never a
# blank `actor { };` (PR #177) and never a hand-written guess (PR #311, M0263
# at import). After the next successful Caffeine deploy, replace it with that
# build's `.most` and add the same file under
# src/backend/migrations/snapshots/deployed/. `python3 scripts/check-eop-stables.py`
# and `bash scripts/caffeine-import-gate.sh backend` check the chain against it
# and against every other recorded shape under snapshots/.
[canisters.backend.check-stable]
path = ".old/src/backend/dist/backend.most"

[canisters.backend.migrations]
chain = "src/backend/migrations"
# Must be >= number of chain files so `mops check` keeps the empty-canister
# genesis (20260801, OldActor = {}) and a fresh install still compiles (M0263).
check-limit = 5

[toolchain]
moc = "1.11.2"
lintoko = "0.11.0"

[lint]
extends = true

[moc]
args = [ "-E=M0236,M0235,M0223,M0237", "-W=M0254", "-A=M0198", "--default-persistent-actors", "--implicit-package=core", "-no-check-ir" ]

[dependencies]
core = "2.6.1"
base = "0.16.0"
caffeineai-authorization = "0.1.1"
caffeineai-oql = "0.4.0"
ic = "4.2.0"
